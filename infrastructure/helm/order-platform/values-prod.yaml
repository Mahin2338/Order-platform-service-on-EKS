# Production-specific settings. No secret values are stored here.
apiGateway:
  existingSecret: "api-gateway-secrets"
  replicas: 1
  image:
    repository: "792289066018.dkr.ecr.eu-west-2.amazonaws.com/order-platform/api-gateway"
    tag: "1.0.0"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"

