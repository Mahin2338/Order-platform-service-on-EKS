# Apply Terraform IAM changes before deploying this worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          ports:
            - containerPort: {{ .Values.worker.containerPort }}
          env:
            - name: HEALTH_PORT
              value: {{ .Values.worker.containerPort | quote }}
            - name: AWS_REGION
              value: {{ .Values.worker.awsRegion | quote }}
            - name: SQS_QUEUE_URL
              value: {{ .Values.worker.sqsQueueUrl | quote }}
            - name: ORDER_SERVICE_URL
              value: {{ .Values.worker.backendUrls.order | quote }}
            - name: INVENTORY_SERVICE_URL
              value: {{ .Values.worker.backendUrls.inventory | quote }}
            - name: PAYMENT_SERVICE_URL
              value: {{ .Values.worker.backendUrls.payment | quote }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ .Values.worker.backendUrls.notification | quote }}
            - name: SHIPPING_SERVICE_URL
              value: {{ .Values.worker.backendUrls.shipping | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.worker.containerPort }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.worker.containerPort }}
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu | quote }}
              memory: {{ .Values.worker.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu | quote }}
              memory: {{ .Values.worker.resources.limits.memory | quote }}
